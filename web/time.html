<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>讲伴 · 时间</title>
<link rel="icon" type="image/svg+xml" href="/brand.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <a class="brand" href="/"><img class="brand-icon" src="/brand.svg" alt="">讲伴 <span>时间</span></a>
  <nav class="nav">
    <a href="/">首页</a>
    <a href="/plan.html">计划</a>
    <a class="on" href="/time.html">时间</a>
    <a href="/talk.html">讲题</a>
    <a href="/correct.html">切题校正</a>
  </nav>
</header>
<main>
  <section class="hero">
    <h1>今天怎么排？</h1>
    <p>先分科目，再在数学/408 块里按「到期 → 新题」。默认留 20% 缓冲。</p>
  </section>
  <section class="card" style="margin-top:14px;">
    <div class="card-head"><h2>今天可用多久</h2><span id="dateLabel" class="muted"></span></div>
    <div id="minuteChips" class="chips">
      <button class="chip" data-min="60">60 分钟</button>
      <button class="chip" data-min="90">90 分钟</button>
      <button class="chip on" data-min="120">2 小时</button>
      <button class="chip" data-min="180">3 小时</button>
      <button class="chip" data-min="240">4 小时</button>
    </div>
    <div class="row" style="margin-top:10px;">
      <input id="customMin" type="number" min="30" max="720" placeholder="自定义分钟" style="width:130px;padding:8px;border:1px solid var(--line);border-radius:9px;">
      <button id="planBtn" class="btn dark">排今天</button>
      <button id="confirmBtn" class="btn line" hidden>确认执行</button>
      <span id="status" class="muted"></span>
    </div>
  </section>
  <div id="timeResult" class="section"><div class="empty">还没有排今天。</div></div>
  <div class="foot">时间环只提议；确认后才算今天队列。到期只在题上。</div>
</main>
<script src="/time.js"></script>
</body>
</html>
